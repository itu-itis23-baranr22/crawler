[tool.ruff]
line-length = 130
target-version = "py310"
exclude = ["data", "static", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "UP006", # the codebase uses typing.Dict and friends throughout
    "UP035",
    "UP045",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"] # each test's web page reads best on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
