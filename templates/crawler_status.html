{% extends "base.html" %}

{% block title %}Crawl status - Crawler{% endblock %}

{% block content %}
  <main class="status-page" id="main">
    <div class="status-inner">
      <a class="back-link" href="/">All crawls</a>
      <div id="crawl-view"></div>
    </div>
  </main>
{% endblock %}

{% block scripts %}
  <script>
    window.CRAWLER_ID = {{ crawler_id|tojson }};
  </script>
  <script src="{{ url_for('static', filename='crawl_view.js') }}"></script>
  <script src="{{ url_for('static', filename='crawler_status.js') }}"></script>
{% endblock %}
