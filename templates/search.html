{% extends "base.html" %}

{% block title %}Search - Crawler{% endblock %}

{% block content %}
  <main class="search-page" id="main">
    <h1 class="visually-hidden">Search</h1>

    <form id="search-form" role="search">
      <label class="visually-hidden" for="search-query">Search the pages you have crawled</label>
      <div class="search-row">
        <input
          id="search-query"
          name="q"
          type="search"
          placeholder="Search the pages you have crawled"
          autocomplete="off"
          maxlength="500"
        />
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" class="btn btn-secondary" id="lucky-btn">Feeling Lucky</button>
      </div>

      <div class="search-options">
        <label for="search-sort">
          Sort by
          <select id="search-sort">
            <option value="relevance">Relevance</option>
            <option value="depth">Depth, shallowest first</option>
          </select>
        </label>
        <label for="search-size">
          Results per page
          <select id="search-size">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </form>

    <section class="search-panel" id="search-panel" aria-label="Search results">
      <p class="results-summary" id="results-summary" role="status" tabindex="-1"></p>
      <div id="results-area"></div>
      <nav class="pagination" id="pagination" aria-label="Result pages" hidden>
        <button type="button" class="btn btn-secondary" id="prev-page-btn">Previous</button>
        <span class="page-label" id="page-label"></span>
        <button type="button" class="btn btn-secondary" id="next-page-btn">Next</button>
      </nav>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='search.js') }}"></script>
{% endblock %}
