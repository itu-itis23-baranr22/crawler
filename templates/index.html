{% extends "base.html" %}

{% block title %}Crawls - Crawler{% endblock %}

{% block content %}
  <form class="new-crawl" id="crawler-form" novalidate>
    <div class="field field-address">
      <label for="origin">Starting address</label>
      <input id="origin" name="origin" type="url" placeholder="https://example.com" autocomplete="off" spellcheck="false" />
    </div>
    <button type="button" class="btn btn-secondary limits-toggle" id="limits-toggle" aria-expanded="false" aria-controls="limits">Limits</button>
    <div class="limits" id="limits">
    <div class="field">
      <label for="max_depth">Max depth</label>
      <input id="max_depth" name="max_depth" type="number" min="0" max="50" value="2" />
    </div>
    <div class="field">
      <label for="max_pages">Max pages</label>
      <input id="max_pages" name="max_pages" type="number" min="1" value="100" />
    </div>
    <div class="field">
      <label for="hit_rate">Pages/second</label>
      <input id="hit_rate" name="hit_rate" type="number" min="0.1" max="20" step="0.1" value="1" />
    </div>
    <div class="field">
      <label for="queue_limit">Queue limit</label>
      <input id="queue_limit" name="queue_limit" type="number" min="1" value="1000" />
    </div>
    </div>
    <button type="submit" class="btn btn-primary">Start crawl</button>
    <p class="form-error" id="form-error" role="alert" hidden></p>
  </form>

  <main class="dashboard" id="main">
    <section class="crawl-list" aria-labelledby="crawls-heading">
      <h1 id="crawls-heading">Crawls</h1>
      <ul id="crawler-list"></ul>
    </section>
    <section class="crawl-detail" id="crawl-detail" aria-label="Selected crawl"></section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='crawl_view.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
